[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Route /api/* to Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Route Razorpay webhooks
[[redirects]]
  from = "/webhooks/razorpay"
  to = "/.netlify/functions/payment-webhook"
  status = 200

# Auth callback helper
[[redirects]]
  from = "/auth/callback"
  to = "/auth.html?mode=callback"
  status = 200

# Security headers for HTML pages
[[headers]]
  for = "/*.html"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "no-cache, no-store, must-revalidate"

# Cache JS files
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
